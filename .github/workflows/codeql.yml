name: "CodeQL"

on:
  push:
    branches: [main]
    # Reine Daten-Commits von fetch.yml (3x täglich) ändern keinen Code — ein
    # Security-Scan auf unverändertem Code liefert keinen Erkenntnisgewinn
    # (Issue #400). Bewusst NUR am push-Trigger, analog zu ci-cd.yml (#395):
    # bei pull_request bleibt der Check als Merge-Gate für jeden Code-PR aktiv.
    paths-ignore:
      - 'public/data/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
