name: Deploy to GitHub Pages

on:
  # Automatic trigger on push to main
  push:
    branches: [ main ]
  # Fallback: Scheduled deployment every 6 hours (4:00, 10:00, 16:00, 22:00 UTC)
  schedule:
    - cron: '0 4,11,16,18,21 * * *'
  workflow_dispatch:
  workflow_call:  # Allow other workflows to call this workflow

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for web
        run: npm run build:web

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./artifact

      - name: Extract artifact
        run: |
          cd artifact
          tar -xf artifact.tar
          cd ..

      - name: Save build artifacts
        run: |
          mkdir -p /tmp/production-build
          cp -r artifact/* /tmp/production-build/
          echo "Build artifacts saved to /tmp/production-build"

      - name: Checkout gh-pages branch
        run: |
          git fetch origin gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages

      - name: Deploy to root (preserve staging folder)
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save staging folder if it exists
          if [ -d "staging" ]; then
            echo "Preserving staging folder..."
            mv staging staging.bak
          fi

          # Remove old production files (but keep staging)
          find . -maxdepth 1 ! -name 'staging.bak' ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} + 2>/dev/null || true

          # Copy new production build from temp location
          cp -r /tmp/production-build/* .

          # Restore staging folder if it was backed up
          if [ -d "staging.bak" ]; then
            echo "Restoring staging folder..."
            mv staging.bak staging
          fi

          # Add and commit changes
          git add -A
          git commit -m "chore: Deploy production build from ${{ github.sha }}

          🚀 Production deployment
          📦 Branch: main
          🔗 URL: https://s540d.github.io/Energy_Price_Germany/

          🤖 Automated by GitHub Actions" || echo "No changes to commit"

          # Push to gh-pages
          git push origin gh-pages

      - name: Summary
        run: |
          echo "## 🚀 Production Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Production URL:** https://s540d.github.io/Energy_Price_Germany/" >> $GITHUB_STEP_SUMMARY
          echo "**Staging URL:** https://s540d.github.io/Energy_Price_Germany/staging/" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Note: Changes may take 1-2 minutes to appear due to CDN caching" >> $GITHUB_STEP_SUMMARY
