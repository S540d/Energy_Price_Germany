name: Deploy Staging to GitHub Pages

on:
  # Trigger on push to staging branch
  push:
    branches: [ staging ]
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Modify app.json for staging baseUrl
        run: |
          echo "Updating baseUrl for staging deployment..."
          sed -i 's|"baseUrl": "/Energy_Price_Germany"|"baseUrl": "/Energy_Price_Germany/staging"|g' app.json
          echo "Updated app.json:"
          grep -A2 '"web"' app.json

      - name: Modify index.html for staging service worker path
        run: |
          echo "Updating service worker path for staging..."
          sed -i "s|'/Energy_Price_Germany/service-worker.js'|'/Energy_Price_Germany/staging/service-worker.js'|g" public/index.html
          sed -i "s|scope: '/Energy_Price_Germany/'|scope: '/Energy_Price_Germany/staging/'|g" public/index.html
          echo "Updated service worker paths in index.html"

      - name: Build for web (staging)
        run: npm run build:web
        env:
          NODE_ENV: production

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Checkout gh-pages branch
        run: |
          git fetch origin gh-pages
          git checkout gh-pages

      - name: Deploy to staging folder
        run: |
          # Remove old staging folder if exists
          rm -rf staging

          # Copy new build to staging folder
          mkdir -p staging
          cp -r dist/* staging/

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add and commit changes
          git add staging/
          git commit -m "chore: Deploy staging build from ${{ github.sha }}

          🚀 Staging deployment
          📦 Branch: staging
          🔗 URL: https://s540d.github.io/Energy_Price_Germany/staging/

          🤖 Automated by GitHub Actions" || echo "No changes to commit"

          # Push to gh-pages
          git push origin gh-pages

      - name: Summary
        run: |
          echo "## 🚀 Staging Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to staging environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Staging URL:** https://s540d.github.io/Energy_Price_Germany/staging/" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** staging" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Note: Changes may take 1-2 minutes to appear due to CDN caching" >> $GITHUB_STEP_SUMMARY
