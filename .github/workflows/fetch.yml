            PARTS="${PARTS:+$PARTS, }BE: $BE_SOURCE"
          fi
          if [ "${{ steps.compare_dk.outputs.new_data }}" = "true" ]; then
            DK_SOURCE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/dk/marketdata.json", "utf8")).source)')
            PARTS="${PARTS:+$PARTS, }DK: $DK_SOURCE"
          fi

          git commit -m "Update marketdata.json ($PARTS @ $TIMESTAMP)"
          git push

          echo "✅ Changes committed and pushed"
          echo "🚀 Deployment will be triggered automatically by push to main"

      - name: Summary (new data)
        if: >
          steps.compare.outputs.new_data == 'true' ||
          steps.compare_nl.outputs.new_data == 'true' ||
          steps.compare_at.outputs.new_data == 'true' ||
          steps.compare_ch.outputs.new_data == 'true' ||
          steps.compare_fr.outputs.new_data == 'true' ||
          steps.compare_be.outputs.new_data == 'true' ||
          steps.compare_dk.outputs.new_data == 'true'
        run: |
          echo "✅ Market data updated successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.compare.outputs.new_data }}" = "true" ]; then
            echo "🇩🇪 **DE Source:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/marketdata.json", "utf8")).source)')" >> $GITHUB_STEP_SUMMARY
            echo "📈 **DE Data points:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/marketdata.json", "utf8")).data.length)')" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.compare_nl.outputs.new_data }}" = "true" ]; then
            echo "🇳🇱 **NL Source:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/nl/marketdata.json", "utf8")).source)')" >> $GITHUB_STEP_SUMMARY
            echo "📈 **NL Data points:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/nl/marketdata.json", "utf8")).data.length)')" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.compare_at.outputs.new_data }}" = "true" ]; then
            echo "🇦🇹 **AT Source:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/at/marketdata.json", "utf8")).source)')" >> $GITHUB_STEP_SUMMARY
            echo "📈 **AT Data points:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/at/marketdata.json", "utf8")).data.length)')" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.compare_ch.outputs.new_data }}" = "true" ]; then
            echo "🇨🇭 **CH Source:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/ch/marketdata.json", "utf8")).source)')" >> $GITHUB_STEP_SUMMARY
            echo "📈 **CH Data points:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/ch/marketdata.json", "utf8")).data.length)')" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.compare_fr.outputs.new_data }}" = "true" ]; then
            echo "🇫🇷 **FR Source:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/fr/marketdata.json", "utf8")).source)')" >> $GITHUB_STEP_SUMMARY
            echo "📈 **FR Data points:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/fr/marketdata.json", "utf8")).data.length)')" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.compare_be.outputs.new_data }}" = "true" ]; then
            echo "🇧🇪 **BE Source:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/be/marketdata.json", "utf8")).source)')" >> $GITHUB_STEP_SUMMARY
            echo "📈 **BE Data points:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/be/marketdata.json", "utf8")).data.length)')" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.compare_dk.outputs.new_data }}" = "true" ]; then
            echo "🇩🇰 **DK Source:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/dk/marketdata.json", "utf8")).source)')" >> $GITHUB_STEP_SUMMARY
            echo "📈 **DK Data points:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/dk/marketdata.json", "utf8")).data.length)')" >> $GITHUB_STEP_SUMMARY
          fi
          echo "⏰ **Updated at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Deployment:** Automatically triggered by push to main" >> $GITHUB_STEP_SUMMARY

      - name: Summary (no new data)
        if: >
          steps.compare.outputs.new_data == 'false' &&
          steps.compare_nl.outputs.new_data == 'false' &&
          steps.compare_at.outputs.new_data == 'false' &&
          steps.compare_ch.outputs.new_data == 'false' &&
          steps.compare_fr.outputs.new_data == 'false' &&
          steps.compare_be.outputs.new_data == 'false' &&
          steps.compare_dk.outputs.new_data == 'false'
        run: |
          echo "ℹ️ No new data available – keeping existing marketdata files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f public/data/marketdata.json ]; then
            echo "📊 **DE source:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/marketdata.json", "utf8")).source)')" >> $GITHUB_STEP_SUMMARY
          fi
          echo "⏰ **Checked at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

      # ─── Data health check (Issue #435, schließt #417) ────────────────────────
      #
      # Läuft als LETZTER Step mit `if: always()` – also NACH dem Commit. Die
      # Daten werden in jedem Fall veröffentlicht; dieser Step markiert den Run
      # lediglich zusätzlich als fehlgeschlagen.
      #
      # Zweck: Der Vorfall vom 2026-09-02 (HTTP 429 auf ren_share_forecast) lief
      # GRÜN durch – sichtbar war er nur in der App als "Erneuerbare: --". Ein
      # roter Run löst GitHubs Standard-"workflow run failed"-Mail aus und
      # schließt damit den in #417 gesuchten Benachrichtigungsweg, ohne
      # zusätzliche Infrastruktur (kein Webhook, kein Secret, keine Kosten).
      #
      # BEWUSSTE KONSEQUENZ: An Tagen mit echtem Upstream-Ausfall steht ein roter
      # Eintrag in der Run-Historie, obwohl die Preisdaten korrekt committet
      # wurden. Das ist Absicht und KEIN Defekt – nicht "wegreparieren".
      - name: Data health check
        if: always()
        run: |
          node -e '
          const fs = require("fs");

          const berlinDay = (ms) =>
            new Intl.DateTimeFormat("en-CA", {
              timeZone: "Europe/Berlin",
              year: "numeric", month: "2-digit", day: "2-digit",
            }).format(new Date(ms));

          const today = berlinDay(Date.now());
          const summary = [];
          const readJson = (p) => {
            try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return null; }
          };

          const renTodayCount = (file) => {
            const j = readJson(file);
            if (!j || !Array.isArray(j.data)) return null;
            return j.data.filter(
              (d) => d.renewable_share != null && berlinDay(d.start_timestamp) === today
            ).length;
          };

          let failed = false;

          // ── DE: fatal ───────────────────────────────────────────────────────
          const deFile = "public/data/marketdata.json";
          const de = readJson(deFile);
          const deRen = renTodayCount(deFile);

          summary.push("### Data health check (" + today + ", Europe/Berlin)");
          summary.push("");

          if (de === null) {
            console.log("::error::DE: " + deFile + " fehlt oder ist unlesbar.");
            summary.push("- **DE: FEHLER** – `marketdata.json` fehlt oder ist unlesbar");
            failed = true;
          } else {
            summary.push("- DE Quelle: `" + de.source + "`");
            summary.push("- DE Erneuerbaren-Punkte heute: **" + deRen + "**");

            if (deRen === 0) {
              console.log(
                "::error::DE: keine Erneuerbaren-Daten fuer heute (" + today + "). " +
                "Der ren_share_forecast-Endpunkt hat nichts Verwertbares geliefert - " +
                "die App zeigt 'Erneuerbare: --'."
              );
              summary.push("- **DE: FEHLER** – 0 Erneuerbaren-Punkte für heute");
              failed = true;
            }

            // Nicht fatal: aWATTar liefert per Design keinen renewable_share.
            if (de.source === "awattar") {
              console.log(
                "::warning::DE: Quelle ist aWATTar - Energy Charts war nicht " +
                "erreichbar, deshalb gibt es per Design keine Erneuerbaren-Daten."
              );
              summary.push("- ⚠️ DE: Fallback auf aWATTar (keine Erneuerbaren-Daten per Design)");
            }
          }

          // ── Beta-Länder: nur Warnung, nie rot ───────────────────────────────
          for (const code of ["nl", "at", "ch", "fr", "be", "dk"]) {
            const file = "public/data/" + code + "/marketdata.json";
            if (!fs.existsSync(file)) continue;
            const n = renTodayCount(file);
            if (n === 0) {
              console.log(
                "::warning::" + code.toUpperCase() + ": keine Erneuerbaren-Daten " +
                "fuer heute (Beta-Land, faerbt den Run nicht rot)."
              );
              summary.push("- ⚠️ " + code.toUpperCase() + ": 0 Erneuerbaren-Punkte für heute (BETA)");
            } else if (n !== null) {
              summary.push("- " + code.toUpperCase() + " Erneuerbaren-Punkte heute: " + n);
            }
          }

          summary.push("");
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\n") + "\n");
          }
          console.log(summary.join("\n"));

          if (failed) process.exit(1);
          '
