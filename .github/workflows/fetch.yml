        run: |
          if [ -f public/data/be/marketdata_new.json ]; then
            node scripts/merge-history.js public/data/be
          fi

      - name: Compare with previous BE data
        id: compare_be
        run: |
          if [ ! -f "public/data/be/marketdata_new.json" ]; then
            echo "new_data=false" >> $GITHUB_OUTPUT
            echo "ℹ️ BE market data not available – skipping BE update"
            exit 0
          fi

          NEW_TS=$(jq '[.data[].start_timestamp] | max' public/data/be/marketdata_new.json)
          NEW_REN=$(jq '[.data[] | select(.renewable_share != null)] | length' public/data/be/marketdata_new.json)

          if [ -f public/data/be/marketdata.json ]; then
            OLD_TS=$(jq '[.data[].start_timestamp] | max' public/data/be/marketdata.json)
            OLD_REN=$(jq '[.data[] | select(.renewable_share != null)] | length' public/data/be/marketdata.json)
          else
            OLD_TS=""
            OLD_REN=0
          fi

          # Auch committen, wenn mehr Erneuerbaren-Werte vorliegen (siehe DE-Block).
          if [ "$OLD_TS" != "$NEW_TS" ] || [ "$NEW_REN" -gt "$OLD_REN" ]; then
