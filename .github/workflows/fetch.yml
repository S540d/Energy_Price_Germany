          if [ ! -f "public/data/be/marketdata_new.json" ]; then
            echo "new_data=false" >> $GITHUB_OUTPUT
            echo "ℹ️ BE market data not available – skipping BE update"
            exit 0
          fi

          NEW_TS=$(jq '[.data[].start_timestamp] | max' public/data/be/marketdata_new.json)
          NEW_REN=$(jq '[.data[] | select(.renewable_share != null)] | length' public/data/be/marketdata_new.json)

          if [ -f public/data/be/marketdata.json ]; then
            OLD_TS=$(jq '[.data[].start_timestamp] | max' public/data/be/marketdata.json)
            OLD_REN=$(jq '[.data[] | select(.renewable_share != null)] | length' public/data/be/marketdata.json)
          else
            OLD_TS=""
            OLD_REN=0
          fi

          # Auch committen, wenn mehr Erneuerbaren-Werte vorliegen (siehe DE-Block).
          if [ "$OLD_TS" != "$NEW_TS" ] || [ "$NEW_REN" -gt "$OLD_REN" ]; then
            echo "new_data=true" >> $GITHUB_OUTPUT
          else
            echo "new_data=false" >> $GITHUB_OUTPUT
          fi

      - name: Update be/marketdata.json and create archive
        if: steps.compare_be.outputs.new_data == 'true'
        run: |
          ARCHIVE_NAME="marketdata_$(date -u +"%Y-%m-%dT%H").json"
          mkdir -p public/data/be/archive
          cp public/data/be/marketdata_new.json "public/data/be/archive/$ARCHIVE_NAME"
          mv public/data/be/marketdata_new.json public/data/be/marketdata.json
          echo "✓ Updated be/marketdata.json"
          echo "✓ Created BE archive: $ARCHIVE_NAME"

      - name: Create daily BE history file
        if: steps.compare_be.outputs.new_data == 'true'
        run: |
          mkdir -p public/data/be/history

          node -e '
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("public/data/be/marketdata.json", "utf8"));

          const now = new Date();
          const yesterday = new Date(now);
          yesterday.setUTCDate(yesterday.getUTCDate() - 1);
          const yesterdayStr = yesterday.toISOString().slice(0, 10);

          const dayStart = new Date(yesterdayStr + "T00:00:00Z").getTime();
          const dayEnd = new Date(yesterdayStr + "T23:59:59Z").getTime();

          const yesterdayData = data.data.filter(item =>
            item.start_timestamp >= dayStart && item.start_timestamp <= dayEnd
          );

          const historyFile = "public/data/be/history/" + yesterdayStr + ".json";

          if (yesterdayData.length >= 92) {
            if (!fs.existsSync(historyFile)) {
              fs.writeFileSync(historyFile, JSON.stringify({
                date: yesterdayStr,
                source: data.source,
                data: yesterdayData
              }, null, 2));
              console.log("✓ Created BE history file: " + yesterdayStr + ".json (" + yesterdayData.length + " points)");
            } else {
              console.log("✓ BE history file already exists: " + yesterdayStr + ".json");
            }

            // Pre-aggregated hourly variant (~75% smaller) for long-range views (#334)
            const hourlyFile = "public/data/be/history/" + yesterdayStr + "-hourly.json";
            if (!fs.existsSync(hourlyFile)) {
              const avg = values => values.length ? values.reduce((s, v) => s + v, 0) / values.length : null;
              const buckets = new Map();
              for (const item of yesterdayData) {
                const bucketTs = Math.floor(item.start_timestamp / 3600000) * 3600000;
                (buckets.get(bucketTs) || buckets.set(bucketTs, []).get(bucketTs)).push(item);
              }
              const hourlyData = Array.from(buckets.entries())
                .sort(([a], [b]) => a - b)
                .map(([bucketTs, items]) => ({
                  start_timestamp: bucketTs,
                  end_timestamp: bucketTs + 3600000,
                  marketprice: avg(items.filter(i => i.marketprice != null).map(i => i.marketprice)),
                  renewable_share: avg(items.filter(i => i.renewable_share != null).map(i => i.renewable_share)),
                  unit: items[0].unit,
                  interpolated: items.some(i => i.interpolated),
                }));
              fs.writeFileSync(hourlyFile, JSON.stringify({
                date: yesterdayStr,
                source: data.source,
                resolution: "hourly",
                data: hourlyData
              }, null, 2));
              console.log("✓ Created BE hourly history file: " + yesterdayStr + "-hourly.json (" + hourlyData.length + " points)");
            }
          } else {
            console.log("⚠️ Incomplete BE data for " + yesterdayStr + " (" + yesterdayData.length + "/96 points) - skipping");
          }
          '

      - name: Cleanup old BE archives (keep 90 days)
        if: steps.compare_be.outputs.new_data == 'true'
        run: |
          ARCHIVE_DIR="public/data/be/archive"
          DAYS_TO_KEEP=90
          CUTOFF_DATE=$(date -u -d "$DAYS_TO_KEEP days ago" +"%Y-%m-%d" 2>/dev/null || date -u -v-${DAYS_TO_KEEP}d +"%Y-%m-%d")
          DELETED=0
          for file in "$ARCHIVE_DIR"/marketdata_*.json; do
            if [ -f "$file" ]; then
              FILE_DATE=$(basename "$file" | sed 's/marketdata_\([0-9-]*\)T.*/\1/')
              if [ "$FILE_DATE" \< "$CUTOFF_DATE" ]; then
                rm "$file"
                DELETED=$((DELETED + 1))
              fi
            fi
          done
          [ $DELETED -gt 0 ] && echo "🧹 Cleaned up $DELETED old BE archives" || echo "✓ No old BE archives to clean up"

      - name: Cleanup old BE history files (keep 90 days)
