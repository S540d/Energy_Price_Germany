name: Fetch aWATTar market data
on:
  schedule:
    - cron: '0 * * * *'   # Läuft jede volle Stunde
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download new data
        run: |
          mkdir -p data
          curl -fsSL "https://api.awattar.de/v1/marketdata" -o data/marketdata_new.json

      - name: Compare with previous data
        id: compare
        run: |
          if [ -f data/marketdata.json ]; then
            # Extrahiere den letzten Timestamp beider Dateien
            OLD_TS=$(jq '[.data[].start_timestamp] | max' data/marketdata.json)
            NEW_TS=$(jq '[.data[].start_timestamp] | max' data/marketdata_new.json)
            echo "OLD_TS=$OLD_TS"
            echo "NEW_TS=$NEW_TS"

            if [ "$NEW_TS" != "null" ] && [ "$OLD_TS" != "$NEW_TS" ]; then
              echo "new_data=true" >> $GITHUB_OUTPUT
            else
              echo "new_data=false" >> $GITHUB_OUTPUT
            fi
          else
            # Es gibt noch keine alte Datei → erste Speicherung erzwingen
            echo "new_data=true" >> $GITHUB_OUTPUT
          fi

      - name: Replace and commit if changed
        if: steps.compare.outputs.new_data == 'true'
        run: |
          mv data/marketdata_new.json data/marketdata.json
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/marketdata.json
          git commit -m "Update marketdata.json (new data from aWATTar)"
          git push

      - name: Skip commit if no change
        if: steps.compare.outputs.new_data == 'false'
        run: echo "No new data available – skipping commit."
