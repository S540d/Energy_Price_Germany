name: Fetch energy market data
on:
  schedule:
    # Stündlich zwischen 10:00 und 15:00 UTC (11:00 bis 16:00 MEZ / 12:00 bis 17:00 MESZ)
    - cron: '0 08-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Try fetching from Energy Charts API (preferred source)
        id: energy_charts
        continue-on-error: true
        run: |
          mkdir -p public/data

          # Energy Charts: Renewable share forecast (15-min resolution)
          curl -fsSL "https://api.energy-charts.info/ren_share_forecast?country=de" -o public/data/renewable_raw.json || exit 1

          # Energy Charts: Day-ahead prices (15-min resolution)
          curl -fsSL "https://api.energy-charts.info/price?country=de" -o public/data/price_raw.json || exit 1

          echo "success=true" >> $GITHUB_OUTPUT

      - name: Process Energy Charts data if successful
        if: steps.energy_charts.outputs.success == 'true'
        run: |
          node -e '
          const fs = require("fs");

          try {
            const renewable = JSON.parse(fs.readFileSync("public/data/renewable_raw.json", "utf8"));
            const price = JSON.parse(fs.readFileSync("public/data/price_raw.json", "utf8"));

            // Merge price and renewable data based on unix_seconds timestamp
            const merged = [];
            const renewableMap = new Map();

            // Index renewable data by timestamp
            if (renewable.unix_seconds && renewable.ren_share) {
              renewable.unix_seconds.forEach((ts, i) => {
                renewableMap.set(ts * 1000, renewable.ren_share[i]); // Convert to ms
              });
            }

            // Merge with price data
            if (price.unix_seconds && price.price) {
              price.unix_seconds.forEach((ts, i) => {
                const timestamp_ms = ts * 1000;
                merged.push({
                  start_timestamp: timestamp_ms,
                  end_timestamp: timestamp_ms + 15 * 60 * 1000, // 15 minutes
                  marketprice: price.price[i],
                  renewable_share: renewableMap.get(timestamp_ms) || null,
                  unit: "Eur/MWh"
                });
              });
            }

            // Sort by timestamp
            merged.sort((a, b) => a.start_timestamp - b.start_timestamp);

            fs.writeFileSync("public/data/energycharts_temp.json", JSON.stringify({
              object: "list",
              source: "energy-charts",
              data: merged
            }, null, 2));

            console.log("Successfully processed Energy Charts data");
          } catch (error) {
            console.error("Error processing Energy Charts data:", error);
            process.exit(1);
          }
          '
          rm -f public/data/renewable_raw.json public/data/price_raw.json

      - name: Fetch aWATTar data for supplementation or fallback
        run: |
          echo "Fetching aWATTar data..."
          curl -fsSL "https://api.awattar.de/v1/marketdata" -o public/data/marketdata_raw.json || echo "aWATTar fetch failed"

      - name: Merge Energy Charts with aWATTar or use aWATTar as fallback
        run: |
          node -e '
          const fs = require("fs");

          // Interpolate aWATTar data to 15-minute intervals
          function interpolateAwattarData(raw) {
            raw.data.sort((a, b) => a.start_timestamp - b.start_timestamp);
            const interpolated = [];

            for (let i = 0; i < raw.data.length; i++) {
              const current = raw.data[i];
              const next = raw.data[i + 1];
              const start = current.start_timestamp;
              const end = current.end_timestamp;
              const currentPrice = current.marketprice;
              const duration = end - start;
              const intervals = Math.floor(duration / (15 * 60 * 1000));

              if (next) {
                const timeDiff = next.start_timestamp - current.start_timestamp;
                const priceDiff = next.marketprice - current.marketprice;

                for (let j = 0; j < intervals; j++) {
                  const timeOffset = j * 15 * 60 * 1000;
                  const interpolationFactor = timeOffset / timeDiff;
                  const interpolatedPrice = currentPrice + (priceDiff * interpolationFactor);

                  interpolated.push({
                    start_timestamp: start + timeOffset,
                    end_timestamp: start + (j + 1) * 15 * 60 * 1000,
                    marketprice: Math.round(interpolatedPrice * 100) / 100,
                    renewable_share: null,
                    unit: current.unit
                  });
                }
              } else {
                for (let j = 0; j < intervals; j++) {
                  interpolated.push({
                    start_timestamp: start + j * 15 * 60 * 1000,
                    end_timestamp: start + (j + 1) * 15 * 60 * 1000,
                    marketprice: currentPrice,
                    renewable_share: null,
                    unit: current.unit
                  });
                }
              }
            }
            return interpolated;
          }

          try {
            let finalData = [];
            let source = "awattar";

            // Check if Energy Charts data exists
            const hasEnergyCharts = fs.existsSync("public/data/energycharts_temp.json");

            if (hasEnergyCharts) {
              const energyChartsData = JSON.parse(fs.readFileSync("public/data/energycharts_temp.json", "utf8"));
              console.log("Energy Charts data available with " + energyChartsData.data.length + " points");

              // Get last timestamp from Energy Charts
              const lastECTimestamp = energyChartsData.data[energyChartsData.data.length - 1].end_timestamp;
              const lastECDate = new Date(lastECTimestamp);
              console.log("Energy Charts last timestamp: " + lastECDate.toISOString());

              // Load and interpolate aWATTar data
              if (fs.existsSync("public/data/marketdata_raw.json")) {
                const awattarRaw = JSON.parse(fs.readFileSync("public/data/marketdata_raw.json", "utf8"));
                const awattarData = interpolateAwattarData(awattarRaw);
                console.log("aWATTar data interpolated to " + awattarData.length + " points");

                // Get last timestamp from aWATTar
                const lastAWTimestamp = awattarData[awattarData.length - 1].end_timestamp;
                const lastAWDate = new Date(lastAWTimestamp);
                console.log("aWATTar last timestamp: " + lastAWDate.toISOString());

                // Calculate time difference in hours
                const timeDiffMs = lastAWTimestamp - lastECTimestamp;
                const timeDiffHours = timeDiffMs / (1000 * 60 * 60);
                console.log("Time difference: " + timeDiffHours.toFixed(2) + " hours");

                // Only supplement if difference is >= 3 hours
                if (timeDiffHours >= 3) {
                  console.log("Supplementing Energy Charts with aWATTar data (difference >= 3h)");

                  // Filter aWATTar data: only data AFTER last Energy Charts timestamp
                  const supplementalData = awattarData.filter(item => 
                    item.start_timestamp >= lastECTimestamp
                  );

                  console.log("Adding " + supplementalData.length + " supplemental data points from aWATTar");

                  // Merge: Energy Charts + supplemental aWATTar
                  finalData = [...energyChartsData.data, ...supplementalData];
                  source = "energy-charts";
                } else {
                  console.log("No supplement needed (difference < 3h), using Energy Charts only");
                  finalData = energyChartsData.data;
                  source = "energy-charts";
                }
              } else {
                console.log("aWATTar data not available, using Energy Charts only");
                finalData = energyChartsData.data;
                source = "energy-charts";
              }

              // Clean up temp file
              fs.unlinkSync("public/data/energycharts_temp.json");
            } else {
              // Fallback: Energy Charts failed, use aWATTar only
              console.log("Energy Charts data not available, falling back to aWATTar");
              const awattarRaw = JSON.parse(fs.readFileSync("public/data/marketdata_raw.json", "utf8"));
              finalData = interpolateAwattarData(awattarRaw);
              source = "awattar";
            }

            // Sort final data
            finalData.sort((a, b) => a.start_timestamp - b.start_timestamp);

            // Write final output
            fs.writeFileSync("public/data/marketdata_new.json", JSON.stringify({
              object: "list",
              source: source,
              data: finalData
            }, null, 2));

            console.log("Final dataset: " + finalData.length + " points, source: " + source);

          } catch (error) {
            console.error("Error merging data:", error);
            process.exit(1);
          } finally {
            // Clean up
            if (fs.existsSync("public/data/marketdata_raw.json")) {
              fs.unlinkSync("public/data/marketdata_raw.json");
            }
            if (fs.existsSync("public/data/energycharts_temp.json")) {
              fs.unlinkSync("public/data/energycharts_temp.json");
            }
          }
          '

      - name: Compare with previous data
        id: compare
        run: |
          NEW_TS=$(jq '[.data[].start_timestamp] | max' public/data/marketdata_new.json)
          if [ -f public/data/marketdata.json ]; then
            OLD_TS=$(jq '[.data[].start_timestamp] | max' public/data/marketdata.json)
          else
            OLD_TS=""
          fi

          echo "OLD_TS=$OLD_TS"
          echo "NEW_TS=$NEW_TS"

          if [ "$OLD_TS" != "$NEW_TS" ]; then
            echo "new_data=true" >> $GITHUB_OUTPUT
          else
            echo "new_data=false" >> $GITHUB_OUTPUT
          fi

      - name: Archive and commit if changed
        if: steps.compare.outputs.new_data == 'true'
        run: |
          mkdir -p public/data/archive
          ts=$(date -u +"%Y-%m-%dT%H")
          SOURCE=$(jq -r '.source // "unknown"' public/data/marketdata_new.json)
          cp public/data/marketdata_new.json "public/data/archive/marketdata_${ts}.json"
          mv public/data/marketdata_new.json public/data/marketdata.json

          # Alte Archive (>30 Tage) löschen
          find public/data/archive/ -type f -name "marketdata_*.json" -mtime +30 -print -delete

          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add public/data/marketdata.json public/data/archive/
          git commit -m "Update marketdata.json (source: ${SOURCE} @ ${ts} UTC)"
          git push

      - name: Skip commit if no change
        if: steps.compare.outputs.new_data == 'false'
        run: echo "No new data available – skipping commit."

      - name: Trigger deployment if data changed
        if: steps.compare.outputs.new_data == 'true'
        run: |
          echo "New data detected - triggering deployment workflow"
          gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
