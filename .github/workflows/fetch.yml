name: Fetch energy market data
on:
  schedule:
    # Issue #435: 6 Slots statt 3. Nur 03 und 13 UTC laufen unbedingt durch;
    # 06, 09, 16 und 19 UTC gehen durch das datenbasierte Gate unten und
    # starten den teuren `update`-Job nur, wenn sie etwas verbessern würden.
    #
    # 03:00 UTC = 04:00 CET / 05:00 CEST  IMMER – EC Nacht-Update abholen, liefert
    #             i.d.R. den vollständigen Day-Ahead-Datensatz für den laufenden Tag
    # 06:00 UTC                           bedingt – frühe Erholung nach einem
    #             fehlgeschlagenen Nachtlauf (der 429-Fall vom 2026-09-02)
    # 09:00 UTC                           bedingt – zweite Erholungschance
    # 13:00 UTC = 14:00 CET / 15:00 CEST  IMMER – primärer Lauf; Day-Ahead-Daten
    #             für "morgen" beginnen ab hier verfügbar zu werden
    # 16:00 UTC                           bedingt
    # 19:00 UTC = 20:00 CET / 21:00 CEST  bedingt
    #
    # Laufzeit: an einem normalen Tag 2 volle Läufe (~90s) + 4 Gates (~20s)
    # ≈ 3 min – praktisch identisch zu den früheren 3 vollen Läufen (~4,5 min),
    # bei doppelt so vielen Erholungschancen.
    - cron: '0 3,6,9,13,16,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

# curl-Optionen NUR NOCH für den aWATTar-Call weiter unten.
#
# Issue #435: Alle Energy-Charts-Aufrufe laufen inzwischen über
# scripts/fetch-energy-charts.sh, das seine Retry-Logik selbst mitbringt
# (exponentielles Backoff 5/15/45s, Retry-After-Header, Payload-Validierung).
# Diese Variable bitte NICHT wieder auf die Energy-Charts-Blöcke ausdehnen –
# sonst liegt die Retry-Logik wieder an zwei Stellen.
#
# Hintergrund für aWATTar: Die ersten ausgehenden Verbindungen eines frischen
# Runners laufen regelmäßig in einen Connect-Hang ("curl: (28) Failed to connect
# ... after 134449 ms"), während derselbe Host Sekunden später sofort antwortet.
# --connect-timeout begrenzt den Hang (statt ~134s), --retry-all-errors deckt
# neben Timeouts (28) auch "couldn't connect" (7) ab.
env:
  CURL_OPTS: "--connect-timeout 15 --retry 3 --retry-delay 5 --retry-all-errors"

jobs:
  # Issue #435: Das Gate entscheidet datenbasiert, ob sich ein voller Lauf lohnt.
  #
  # Vorher (#406) wurde dafür die Commit-Message des letzten Laufs ausgewertet
  # (`grep -Eq "@ ${TODAY}T(1[3-9]) UTC"`). Diese Heuristik prüfte aber nur, *ob*
  # committet wurde – nicht, *ob Daten fehlen*. Im 429-Vorfall vom 2026-09-02
  # hätte sie den Fallback fälschlich übersprungen: es gab einen Commit, er
  # enthielt Preise, aber keinerlei Erneuerbaren-Daten. Genau der Fall, der in
  # der App als "Erneuerbare: --" sichtbar wurde.
  #
  # Jetzt werden stattdessen zwei billige DE-Calls gegen die committete
  # marketdata.json gehalten. Kosten: ~20s statt ~90s für den vollen Lauf.
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      run-fetch: ${{ steps.decide.outputs.run-fetch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Probe Energy Charts (DE) for the gate decision
        id: probe
        continue-on-error: true
        run: |
          HOUR_UTC=$(date -u +%H)
          # Die beiden Pflicht-Slots brauchen keine Probe.
          if [ "$HOUR_UTC" = "03" ] || [ "$HOUR_UTC" = "13" ]; then
            echo "Pflicht-Slot ${HOUR_UTC}:00 UTC – keine Probe nötig."
            exit 0
          fi
          # Wiederverwendung desselben Fetch-Skripts – kein zweiter Retry-Code.
          scripts/fetch-energy-charts.sh de "${RUNNER_TEMP}/gate-probe"

      - name: Decide whether this conditional run is needed
        id: decide
        run: |
          HOUR_UTC=$(date -u +%H)

          # 03 und 13 UTC laufen immer voll (Nacht-Update / primärer Day-Ahead-Slot).
          if [ "$HOUR_UTC" = "03" ] || [ "$HOUR_UTC" = "13" ]; then
            echo "Pflicht-Slot ${HOUR_UTC}:00 UTC – voller Lauf."
            echo "run-fetch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROBE_DIR="${RUNNER_TEMP}/gate-probe"

          # Fail open: Wenn die Probe selbst nicht durchkam, entscheidet das Gate
          # nicht gegen einen Lauf. Der update-Job bringt eigene Retries und den
          # aWATTar-Fallback mit und kann mehr ausrichten als das Gate.
          if [ ! -f "${PROBE_DIR}/price_raw.json" ]; then
            echo "Probe fehlgeschlagen – im Zweifel voller Lauf."
            echo "run-fetch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_FETCH=$(node -e '
          const fs = require("fs");

          const probeDir = process.argv[1];
          const readJson = (p) => {
            try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return null; }
          };

          const berlinDay = (ms) =>
            new Intl.DateTimeFormat("en-CA", {
              timeZone: "Europe/Berlin",
              year: "numeric", month: "2-digit", day: "2-digit",
            }).format(new Date(ms));

          const today = berlinDay(Date.now());

          const committed = readJson("public/data/marketdata.json");
          const apiPrice = readJson(probeDir + "/price_raw.json");
          const apiRen = readJson(probeDir + "/renewable_raw.json");

          // Ohne committete Datei gibt es nichts zu vergleichen -> laufen lassen.
          if (!committed || !Array.isArray(committed.data) || committed.data.length === 0) {
            console.log("true");
            process.exit(0);
          }

          const reasons = [];

          // (a) Neue Preis-Abdeckung?
          const fileMaxMs = Math.max(...committed.data.map((d) => d.start_timestamp || 0));
          if (apiPrice && Array.isArray(apiPrice.unix_seconds) && apiPrice.unix_seconds.length) {
            const apiMaxMs = Math.max(...apiPrice.unix_seconds) * 1000;
            if (apiMaxMs > fileMaxMs) {
              reasons.push(
                "neue Preis-Abdeckung: API bis " + new Date(apiMaxMs).toISOString() +
                ", Datei bis " + new Date(fileMaxMs).toISOString()
              );
            }
          }

          // (b) Schliesst sich eine Erneuerbaren-Luecke fuer heute?
          const fileRenToday = committed.data.filter(
            (d) => d.renewable_share != null && berlinDay(d.start_timestamp) === today
          ).length;

          let apiRenToday = 0;
          if (apiRen && Array.isArray(apiRen.unix_seconds) && Array.isArray(apiRen.ren_share)) {
            for (let i = 0; i < apiRen.unix_seconds.length; i++) {
              if (apiRen.ren_share[i] == null) continue;
              if (berlinDay(apiRen.unix_seconds[i] * 1000) === today) apiRenToday++;
            }
          }
          if (apiRenToday > fileRenToday) {
            reasons.push(
              "Erneuerbaren-Luecke schliesst sich: API " + apiRenToday +
              " Punkte heute vs. Datei " + fileRenToday
            );
          }

          for (const r of reasons) console.error("  - " + r);
          if (reasons.length === 0) {
            console.error("  - keine Verbesserung gegenueber der committeten Datei");
          }
          console.log(reasons.length > 0 ? "true" : "false");
          ' "$PROBE_DIR")

          echo "Gate-Entscheidung fuer ${HOUR_UTC}:00 UTC: run-fetch=${RUN_FETCH}"
          echo "run-fetch=${RUN_FETCH}" >> "$GITHUB_OUTPUT"

          {
            echo "### Gate (${HOUR_UTC}:00 UTC)"
            echo ""
            echo "\`run-fetch\` = **${RUN_FETCH}**"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  update:
    needs: gate
    if: always() && (needs.gate.result == 'skipped' || needs.gate.outputs.run-fetch == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      # ─── Germany (DE) ─────────────────────────────────────────────────────────

      - name: Try fetching from Energy Charts API (preferred source)
        id: energy_charts
        continue-on-error: true
        run: scripts/fetch-energy-charts.sh de public/data

      - name: Process Energy Charts data if successful
        if: steps.energy_charts.outputs.success == 'true'
        run: |
          node -e '
          const fs = require("fs");

          try {
            const renewableRaw = fs.existsSync("public/data/renewable_raw.json") ? fs.readFileSync("public/data/renewable_raw.json", "utf8") : null;
            const renewable = renewableRaw ? JSON.parse(renewableRaw) : {};
            const price = JSON.parse(fs.readFileSync("public/data/price_raw.json", "utf8"));

            // Create maps for price and renewable data
            const priceMap = new Map();
            const renewableMap = new Map();
            const allTimestamps = new Set();

            // Index price data by timestamp
            if (price.unix_seconds && price.price) {
              price.unix_seconds.forEach((ts, i) => {
                const timestamp_ms = ts * 1000;
                priceMap.set(timestamp_ms, price.price[i]);
                allTimestamps.add(timestamp_ms);
              });
            }

            // Index renewable data by timestamp
            if (renewable.unix_seconds && renewable.ren_share) {
              renewable.unix_seconds.forEach((ts, i) => {
                const timestamp_ms = ts * 1000;
                renewableMap.set(timestamp_ms, renewable.ren_share[i]);
                allTimestamps.add(timestamp_ms);
              });
            }

            // Merge ALL timestamps (price + renewable, typically 24h price + 48h renewable)
            const merged = Array.from(allTimestamps).map(timestamp_ms => ({
              start_timestamp: timestamp_ms,
              end_timestamp: timestamp_ms + 15 * 60 * 1000, // 15 minutes
              marketprice: priceMap.get(timestamp_ms) || null,
              renewable_share: renewableMap.get(timestamp_ms) || null,
              unit: "Eur/MWh",
              interpolated: false
            }));

            // Sort by timestamp
            merged.sort((a, b) => a.start_timestamp - b.start_timestamp);

            console.log("Successfully processed Energy Charts data:");
            console.log("- Price points: " + priceMap.size);
            console.log("- Renewable points: " + renewableMap.size);
            console.log("- Total merged points: " + merged.length);

            // Count points with both vs only renewable
            const bothCount = merged.filter(p => p.marketprice !== null && p.renewable_share !== null).length;
            const renewableOnlyCount = merged.filter(p => p.marketprice === null && p.renewable_share !== null).length;
            console.log("- Points with both price+renewable: " + bothCount);
            console.log("- Points with renewable only (for tomorrow): " + renewableOnlyCount);

            fs.writeFileSync("public/data/energycharts_temp.json", JSON.stringify({
              object: "list",
              source: "energy-charts",
              data: merged
            }, null, 2));

          } catch (error) {
            console.error("Error processing Energy Charts data:", error);
            process.exit(1);
          }
          '
          rm -f public/data/renewable_raw.json public/data/price_raw.json

      - name: Fetch aWATTar data for supplementation or fallback
        run: |
          echo "Fetching aWATTar data..."
          curl -fsSL $CURL_OPTS "https://api.awattar.de/v1/marketdata" -o public/data/marketdata_raw.json || echo "aWATTar fetch failed"

      - name: Merge Energy Charts with aWATTar or use aWATTar as fallback
        run: node scripts/merge-market-data.js

      - name: Validate merged market data
        run: |
          node -e '
          const fs = require("fs");

          const file = "public/data/marketdata_new.json";
          if (!fs.existsSync(file)) {
            console.error("❌ marketdata_new.json not found");
            process.exit(1);
          }

          let parsed;
          try {
            parsed = JSON.parse(fs.readFileSync(file, "utf8"));
          } catch (e) {
            console.error("❌ Invalid JSON in marketdata_new.json:", e.message);
            process.exit(1);
          }

          const errors = [];

          // Schema checks
          if (parsed.object !== "list") errors.push("Missing or wrong \"object\" field");
          if (!["energy-charts", "awattar"].includes(parsed.source)) errors.push("Invalid source: " + parsed.source);
          if (!Array.isArray(parsed.data)) errors.push("\"data\" is not an array");

          if (errors.length > 0) {
            errors.forEach(e => console.error("❌ " + e));
            process.exit(1);
          }

          const data = parsed.data;

          // Minimum data points: at least 24h of 15-min intervals (96 points)
          if (data.length < 96) {
            console.error("❌ Too few data points: " + data.length + " (minimum 96)");
            process.exit(1);
          }

          // Must have at least some price data – count only finite numeric values
          const priceCount = data.filter(d => typeof d.marketprice === "number" && isFinite(d.marketprice)).length;
          if (priceCount === 0) {
            console.error("❌ All marketprice values are null/invalid – no usable price data");
            process.exit(1);
          }

          // Coverage check: newest finite timestamp must be within the last 36h
          const now = Date.now();
          const validTs = data.map(d => d.start_timestamp).filter(ts => typeof ts === "number" && isFinite(ts) && ts > 0);
          if (validTs.length === 0) {
            console.error("❌ No valid start_timestamp values found");
            process.exit(1);
          }
          const maxTs = Math.max(...validTs);
          const ageHours = (now - maxTs) / (1000 * 60 * 60);
          if (ageHours > 36) {
            console.error("❌ Newest data point is " + ageHours.toFixed(1) + "h old (max 36h)");
            process.exit(1);
          }

          console.log("✅ Quality check passed:");
          console.log("   Data points : " + data.length);
          console.log("   Price points: " + priceCount);
          console.log("   Newest entry: " + new Date(maxTs).toISOString() + " (" + ageHours.toFixed(1) + "h ago)");
          console.log("   Source      : " + parsed.source);
          '

      - name: Compare with previous data
        id: compare
        run: |
          NEW_TS=$(jq '[.data[].start_timestamp] | max' public/data/marketdata_new.json)
          NEW_REN=$(jq '[.data[] | select(.renewable_share != null)] | length' public/data/marketdata_new.json)

          if [ -f public/data/marketdata.json ]; then
            OLD_TS=$(jq '[.data[].start_timestamp] | max' public/data/marketdata.json)
            OLD_REN=$(jq '[.data[] | select(.renewable_share != null)] | length' public/data/marketdata.json)
          else
            OLD_TS=""
            OLD_REN=0
          fi

          echo "OLD_TS=$OLD_TS"
          echo "NEW_TS=$NEW_TS"
          echo "OLD_REN=$OLD_REN"
          echo "NEW_REN=$NEW_REN"

          # Commit, wenn neuere Daten ODER mehr Erneuerbaren-Werte vorliegen.
          #
          # Der reine Zeitstempel-Vergleich reichte nicht: Nach einem aWATTar-
          # Fallback (liefert renewable_share durchgaengig null) reicht der
          # Datensatz bereits bis zum Ende des Folgetages. Ein spaeterer,
          # erfolgreicher Energy-Charts-Lauf liefert dann denselben
          # max(start_timestamp) – OLD_TS == NEW_TS – und wurde samt seiner
          # frisch geholten Erneuerbaren-Werte verworfen. Beobachtet in Run
          # 33332831834: 96 Renewable-Punkte geholt, "Final dataset: 739 points,
          # source: energy-charts", danach new_data=false und kein Commit.
          #
          # Bewusst nur bei ZUNAHME (-gt), nicht bei blosser Aenderung: ein
          # Rueckgang bedeutet einen Fallback ohne Erneuerbaren-Daten, der die
          # bereits vorhandenen Werte bei ueberlappenden Zeitstempeln
          # ueberschreiben wuerde. Aus demselben Grund ist ein Wechsel von
          # `source` allein kein Ausloeser – energy-charts -> awattar waere eine
          # Verschlechterung.
          if [ "$OLD_TS" != "$NEW_TS" ] || [ "$NEW_REN" -gt "$OLD_REN" ]; then
            echo "new_data=true" >> $GITHUB_OUTPUT
          else
            echo "new_data=false" >> $GITHUB_OUTPUT
          fi

      - name: Update marketdata.json and create archive
        if: steps.compare.outputs.new_data == 'true'
        run: |
          # Create archive with timestamp
          ARCHIVE_NAME="marketdata_$(date -u +"%Y-%m-%dT%H").json"
          mkdir -p public/data/archive
          cp public/data/marketdata_new.json "public/data/archive/$ARCHIVE_NAME"

          # Replace main file
          mv public/data/marketdata_new.json public/data/marketdata.json

          echo "✓ Updated marketdata.json"
          echo "✓ Created archive: $ARCHIVE_NAME"

      - name: Create daily history file (for app historical data)
        if: steps.compare.outputs.new_data == 'true'
        run: |
          mkdir -p public/data/history

          # Extract yesterday's complete data (96 data points = 24h @ 15min)
          node -e '
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("public/data/marketdata.json", "utf8"));

          // Get yesterday date (UTC)
          const now = new Date();
          const yesterday = new Date(now);
          yesterday.setUTCDate(yesterday.getUTCDate() - 1);
          const yesterdayStr = yesterday.toISOString().slice(0, 10);

          // Start and end of yesterday (UTC)
          const dayStart = new Date(yesterdayStr + "T00:00:00Z").getTime();
          const dayEnd = new Date(yesterdayStr + "T23:59:59Z").getTime();

          // Filter data for yesterday
          const yesterdayData = data.data.filter(item =>
            item.start_timestamp >= dayStart && item.start_timestamp <= dayEnd
          );

          // Only save if we have complete data (96 points = 24h @ 15min)
          const historyFile = "public/data/history/" + yesterdayStr + ".json";

          if (yesterdayData.length >= 92) {  // Allow small gaps (92+ of 96)
            if (!fs.existsSync(historyFile)) {
              fs.writeFileSync(historyFile, JSON.stringify({
                date: yesterdayStr,
                source: data.source,
                data: yesterdayData
              }, null, 2));
              console.log("✓ Created history file: " + yesterdayStr + ".json (" + yesterdayData.length + " points)");
            } else {
              console.log("✓ History file already exists: " + yesterdayStr + ".json");
            }

            // Pre-aggregated hourly variant (~75% smaller) for long-range views (#334)
            const hourlyFile = "public/data/history/" + yesterdayStr + "-hourly.json";
            if (!fs.existsSync(hourlyFile)) {
              const avg = values => values.length ? values.reduce((s, v) => s + v, 0) / values.length : null;
              const buckets = new Map();
              for (const item of yesterdayData) {
                const bucketTs = Math.floor(item.start_timestamp / 3600000) * 3600000;
                (buckets.get(bucketTs) || buckets.set(bucketTs, []).get(bucketTs)).push(item);
              }
              const hourlyData = Array.from(buckets.entries())
                .sort(([a], [b]) => a - b)
                .map(([bucketTs, items]) => ({
                  start_timestamp: bucketTs,
                  end_timestamp: bucketTs + 3600000,
                  marketprice: avg(items.filter(i => i.marketprice != null).map(i => i.marketprice)),
                  renewable_share: avg(items.filter(i => i.renewable_share != null).map(i => i.renewable_share)),
                  unit: items[0].unit,
                  interpolated: items.some(i => i.interpolated),
                }));
              fs.writeFileSync(hourlyFile, JSON.stringify({
                date: yesterdayStr,
                source: data.source,
                resolution: "hourly",
                data: hourlyData
              }, null, 2));
              console.log("✓ Created hourly history file: " + yesterdayStr + "-hourly.json (" + hourlyData.length + " points)");
            }
          } else {
            console.log("⚠️ Incomplete data for " + yesterdayStr + " (" + yesterdayData.length + "/96 points) - skipping");
          }
          '

      - name: Cleanup old archives (keep 90 days)
        if: steps.compare.outputs.new_data == 'true'
        run: |
          ARCHIVE_DIR="public/data/archive"
          DAYS_TO_KEEP=90

          # Count archives before cleanup
          BEFORE_COUNT=$(ls -1 "$ARCHIVE_DIR"/*.json 2>/dev/null | wc -l)

          # Find and remove archives older than 90 days
          # Using filename pattern: marketdata_YYYY-MM-DDTHH.json
          CUTOFF_DATE=$(date -u -d "$DAYS_TO_KEEP days ago" +"%Y-%m-%d" 2>/dev/null || date -u -v-${DAYS_TO_KEEP}d +"%Y-%m-%d")

          DELETED=0
          for file in "$ARCHIVE_DIR"/marketdata_*.json; do
            if [ -f "$file" ]; then
              # Extract date from filename (marketdata_2025-11-17T12.json -> 2025-11-17)
              FILE_DATE=$(basename "$file" | sed 's/marketdata_\([0-9-]*\)T.*/\1/')
              if [ "$FILE_DATE" \< "$CUTOFF_DATE" ]; then
                rm "$file"
                DELETED=$((DELETED + 1))
              fi
            fi
          done

          AFTER_COUNT=$(ls -1 "$ARCHIVE_DIR"/*.json 2>/dev/null | wc -l)

          if [ $DELETED -gt 0 ]; then
            echo "🧹 Cleaned up $DELETED old archives (> $DAYS_TO_KEEP days)"
            echo "📁 Archive count: $BEFORE_COUNT → $AFTER_COUNT"
          else
            echo "✓ No old archives to clean up"
          fi

      - name: Cleanup old history files (keep 90 days)
        if: steps.compare.outputs.new_data == 'true'
        run: |
          HISTORY_DIR="public/data/history"
          DAYS_TO_KEEP=90

          if [ -d "$HISTORY_DIR" ]; then
            BEFORE_COUNT=$(ls -1 "$HISTORY_DIR"/*.json 2>/dev/null | wc -l)
            CUTOFF_DATE=$(date -u -d "$DAYS_TO_KEEP days ago" +"%Y-%m-%d" 2>/dev/null || date -u -v-${DAYS_TO_KEEP}d +"%Y-%m-%d")

            DELETED=0
            for file in "$HISTORY_DIR"/*.json; do
              if [ -f "$file" ]; then
                # Filename is date: 2025-11-17.json
                FILE_DATE=$(basename "$file" .json)
                if [ "$FILE_DATE" \< "$CUTOFF_DATE" ]; then
                  rm "$file"
                  DELETED=$((DELETED + 1))
                fi
              fi
            done

            AFTER_COUNT=$(ls -1 "$HISTORY_DIR"/*.json 2>/dev/null | wc -l)

            if [ $DELETED -gt 0 ]; then
              echo "🧹 Cleaned up $DELETED old history files (> $DAYS_TO_KEEP days)"
              echo "📁 History count: $BEFORE_COUNT → $AFTER_COUNT"
            else
              echo "✓ No old history files to clean up"
            fi
          fi

      - name: Cleanup temporary file
        if: steps.compare.outputs.new_data == 'false'
        run: |
          # Remove temporary file if no update needed
          if [ -f public/data/marketdata_new.json ]; then
            rm -f public/data/marketdata_new.json
            echo "🧹 Cleaned up temporary file (no new data)"
          fi

      # ─── Netherlands (NL) – Energy Charts only, no aWATTar ───────────────────

      - name: Rate-limit guard before NL
        run: sleep 5

      - name: Try fetching NL data from Energy Charts API
        id: energy_charts_nl
        continue-on-error: true
        run: scripts/fetch-energy-charts.sh nl public/data/nl

      - name: Process Energy Charts NL data
        if: steps.energy_charts_nl.outputs.success == 'true'
        continue-on-error: true
        run: |
          node -e '
          const fs = require("fs");

          try {
            const renewableRaw = fs.existsSync("public/data/nl/renewable_raw.json") ? fs.readFileSync("public/data/nl/renewable_raw.json", "utf8") : null;
            const renewable = renewableRaw ? JSON.parse(renewableRaw) : {};
            const price = JSON.parse(fs.readFileSync("public/data/nl/price_raw.json", "utf8"));

            const priceMap = new Map();
            const renewableMap = new Map();
            const allTimestamps = new Set();

            if (price.unix_seconds && price.price) {
              price.unix_seconds.forEach((ts, i) => {
                const timestamp_ms = ts * 1000;
                priceMap.set(timestamp_ms, price.price[i]);
                allTimestamps.add(timestamp_ms);
              });
            }

            if (renewable.unix_seconds && renewable.ren_share) {
              renewable.unix_seconds.forEach((ts, i) => {
                const timestamp_ms = ts * 1000;
                renewableMap.set(timestamp_ms, renewable.ren_share[i]);
                allTimestamps.add(timestamp_ms);
              });
            }

            const merged = Array.from(allTimestamps).map(timestamp_ms => ({
              start_timestamp: timestamp_ms,
              end_timestamp: timestamp_ms + 15 * 60 * 1000,
              marketprice: priceMap.get(timestamp_ms) || null,
              renewable_share: renewableMap.get(timestamp_ms) || null,
              unit: "Eur/MWh",
              interpolated: false
            }));

            merged.sort((a, b) => a.start_timestamp - b.start_timestamp);

