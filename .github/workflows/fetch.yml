          DAYS_TO_KEEP=90
          if [ -d "$HISTORY_DIR" ]; then
            CUTOFF_DATE=$(date -u -d "$DAYS_TO_KEEP days ago" +"%Y-%m-%d" 2>/dev/null || date -u -v-${DAYS_TO_KEEP}d +"%Y-%m-%d")
            DELETED=0
            for file in "$HISTORY_DIR"/*.json; do
              if [ -f "$file" ]; then
                FILE_DATE=$(basename "$file" .json)
                [ "$FILE_DATE" \< "$CUTOFF_DATE" ] && rm "$file" && DELETED=$((DELETED + 1))
              fi
            done
            [ $DELETED -gt 0 ] && echo "🧹 Cleaned up $DELETED old BE history files" || echo "✓ No old BE history files to clean up"
          fi

      - name: Cleanup BE temporary file
        if: steps.compare_be.outputs.new_data == 'false'
        run: |
          if [ -f public/data/be/marketdata_new.json ]; then
