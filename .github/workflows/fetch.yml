name: Fetch energy market data
on:
  schedule:
    # Stündlich zwischen 10:00 und 15:00 UTC (11:00 bis 16:00 MEZ / 12:00 bis 17:00 MESZ)
    - cron: '0 10-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Try fetching from Energy Charts API (preferred source)
        id: energy_charts
        continue-on-error: true
        run: |
          mkdir -p public

          # Energy Charts: Renewable share forecast (15-min resolution)
          curl -fsSL "https://api.energy-charts.info/ren_share_forecast?country=de" -o public/renewable_raw.json || exit 1

          # Energy Charts: Day-ahead prices (15-min resolution)
          curl -fsSL "https://api.energy-charts.info/price?country=de" -o public/price_raw.json || exit 1

          echo "success=true" >> $GITHUB_OUTPUT

      - name: Process Energy Charts data if successful
        if: steps.energy_charts.outputs.success == 'true'
        run: |
          node -e '
          const fs = require("fs");

          try {
            const renewable = JSON.parse(fs.readFileSync("public/renewable_raw.json", "utf8"));
            const price = JSON.parse(fs.readFileSync("public/price_raw.json", "utf8"));

            // Merge price and renewable data based on unix_seconds timestamp
            const merged = [];
            const renewableMap = new Map();

            // Index renewable data by timestamp
            if (renewable.unix_seconds && renewable.share) {
              renewable.unix_seconds.forEach((ts, i) => {
                renewableMap.set(ts * 1000, renewable.share[i]); // Convert to ms
              });
            }

            // Merge with price data
            if (price.unix_seconds && price.price) {
              price.unix_seconds.forEach((ts, i) => {
                const timestamp_ms = ts * 1000;
                merged.push({
                  start_timestamp: timestamp_ms,
                  end_timestamp: timestamp_ms + 15 * 60 * 1000, // 15 minutes
                  marketprice: price.price[i],
                  renewable_share: renewableMap.get(timestamp_ms) || null,
                  unit: "Eur/MWh"
                });
              });
            }

            // Sort by timestamp
            merged.sort((a, b) => a.start_timestamp - b.start_timestamp);

            fs.writeFileSync("public/marketdata_new.json", JSON.stringify({
              object: "list",
              source: "energy-charts",
              data: merged
            }, null, 2));

            console.log("Successfully processed Energy Charts data");
          } catch (error) {
            console.error("Error processing Energy Charts data:", error);
            process.exit(1);
          }
          '
          rm -f public/renewable_raw.json public/price_raw.json

      - name: Fallback to aWATTar if Energy Charts failed
        if: steps.energy_charts.outputs.success != 'true'
        run: |
          echo "Energy Charts API failed, falling back to aWATTar..."
          curl -fsSL "https://api.awattar.de/v1/marketdata" -o public/marketdata_raw.json

      - name: Interpolate aWATTar data to 15-minute intervals
        if: steps.energy_charts.outputs.success != 'true'
        run: |
          node -e '
          const fs = require("fs");
          const raw = JSON.parse(fs.readFileSync("public/marketdata_raw.json", "utf8"));

          // Sortiere Daten nach Zeitstempel
          raw.data.sort((a, b) => a.start_timestamp - b.start_timestamp);

          const interpolated = [];

          // Verarbeite Daten in Paaren für lineare Interpolation
          for (let i = 0; i < raw.data.length; i++) {
            const current = raw.data[i];
            const next = raw.data[i + 1];

            const start = current.start_timestamp;
            const end = current.end_timestamp;
            const currentPrice = current.marketprice;
            const duration = end - start;

            // Anzahl 15-Minuten-Intervalle in diesem Zeitraum
            const intervals = Math.floor(duration / (15 * 60 * 1000));

            if (next) {
              // Lineare Interpolation zwischen current und next
              const timeDiff = next.start_timestamp - current.start_timestamp;
              const priceDiff = next.marketprice - current.marketprice;

              for (let j = 0; j < intervals; j++) {
                const timeOffset = j * 15 * 60 * 1000;
                const interpolationFactor = timeOffset / timeDiff;
                const interpolatedPrice = currentPrice + (priceDiff * interpolationFactor);

                interpolated.push({
                  start_timestamp: start + timeOffset,
                  end_timestamp: start + (j + 1) * 15 * 60 * 1000,
                  marketprice: Math.round(interpolatedPrice * 100) / 100,
                  renewable_share: null,
                  unit: current.unit
                });
              }
            } else {
              // Letzter Eintrag - verwende konstanten Preis
              for (let j = 0; j < intervals; j++) {
                interpolated.push({
                  start_timestamp: start + j * 15 * 60 * 1000,
                  end_timestamp: start + (j + 1) * 15 * 60 * 1000,
                  marketprice: currentPrice,
                  renewable_share: null,
                  unit: current.unit
                });
              }
            }
          }

          fs.writeFileSync("public/marketdata_new.json", JSON.stringify({
            object: "list",
            source: "awattar",
            data: interpolated
          }, null, 2));
          '
          rm -f public/marketdata_raw.json

      - name: Compare with previous data
        id: compare
        run: |
          NEW_TS=$(jq '[.data[].start_timestamp] | max' public/marketdata_new.json)
          if [ -f public/marketdata.json ]; then
            OLD_TS=$(jq '[.data[].start_timestamp] | max' public/marketdata.json)
          else
            OLD_TS=""
          fi

          echo "OLD_TS=$OLD_TS"
          echo "NEW_TS=$NEW_TS"

          if [ "$OLD_TS" != "$NEW_TS" ]; then
            echo "new_data=true" >> $GITHUB_OUTPUT
          else
            echo "new_data=false" >> $GITHUB_OUTPUT
          fi

      - name: Archive and commit if changed
        if: steps.compare.outputs.new_data == 'true'
        run: |
          mkdir -p public/archive
          ts=$(date -u +"%Y-%m-%dT%H")
          SOURCE=$(jq -r '.source // "unknown"' public/marketdata_new.json)
          cp public/marketdata_new.json "public/archive/marketdata_${ts}.json"
          mv public/marketdata_new.json public/marketdata.json

          # Alte Archive (>30 Tage) löschen
          find public/archive/ -type f -name "marketdata_*.json" -mtime +30 -print -delete

          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add public/marketdata.json public/archive/
          git commit -m "Update marketdata.json (source: ${SOURCE} @ ${ts} UTC)"
          git push

      - name: Skip commit if no change
        if: steps.compare.outputs.new_data == 'false'
        run: echo "No new data available – skipping commit."
