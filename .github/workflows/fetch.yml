      # ─── Commit ───────────────────────────────────────────────────────────────

      - name: Commit changes
        if: >
          steps.compare.outputs.new_data == 'true' ||
          steps.compare_nl.outputs.new_data == 'true' ||
          steps.compare_at.outputs.new_data == 'true' ||
          steps.compare_ch.outputs.new_data == 'true' ||
          steps.compare_fr.outputs.new_data == 'true' ||
          steps.compare_be.outputs.new_data == 'true' ||
          steps.compare_dk.outputs.new_data == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage DE files if updated
          if [ "${{ steps.compare.outputs.new_data }}" = "true" ]; then
            git add public/data/marketdata.json
            git add -A public/data/archive/
            git add -A public/data/history/
          fi

          # Stage NL files if updated
          if [ "${{ steps.compare_nl.outputs.new_data }}" = "true" ]; then
            git add public/data/nl/marketdata.json
            git add -A public/data/nl/archive/
            git add -A public/data/nl/history/
          fi

          # Stage AT files if updated
          if [ "${{ steps.compare_at.outputs.new_data }}" = "true" ]; then
            git add public/data/at/marketdata.json
            git add -A public/data/at/archive/
            git add -A public/data/at/history/
          fi

          # Stage CH files if updated
          if [ "${{ steps.compare_ch.outputs.new_data }}" = "true" ]; then
            git add public/data/ch/marketdata.json
            git add -A public/data/ch/archive/
            git add -A public/data/ch/history/
          fi

          # Stage FR files if updated
          if [ "${{ steps.compare_fr.outputs.new_data }}" = "true" ]; then
            git add public/data/fr/marketdata.json
            git add -A public/data/fr/archive/
            git add -A public/data/fr/history/
          fi

          # Stage BE files if updated
          if [ "${{ steps.compare_be.outputs.new_data }}" = "true" ]; then
            git add public/data/be/marketdata.json
            git add -A public/data/be/archive/
            git add -A public/data/be/history/
          fi

          # Stage DK files if updated
          if [ "${{ steps.compare_dk.outputs.new_data }}" = "true" ]; then
            git add public/data/dk/marketdata.json
            git add -A public/data/dk/archive/
            git add -A public/data/dk/history/
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H UTC")

          # Build commit message listing updated countries and their sources
          PARTS=""
          if [ "${{ steps.compare.outputs.new_data }}" = "true" ]; then
            DE_SOURCE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/marketdata.json", "utf8")).source)')
            PARTS="DE: $DE_SOURCE"
          fi
          if [ "${{ steps.compare_nl.outputs.new_data }}" = "true" ]; then
            NL_SOURCE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/nl/marketdata.json", "utf8")).source)')
            PARTS="${PARTS:+$PARTS, }NL: $NL_SOURCE"
          fi
          if [ "${{ steps.compare_at.outputs.new_data }}" = "true" ]; then
            AT_SOURCE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/at/marketdata.json", "utf8")).source)')
            PARTS="${PARTS:+$PARTS, }AT: $AT_SOURCE"
          fi
          if [ "${{ steps.compare_ch.outputs.new_data }}" = "true" ]; then
            CH_SOURCE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/ch/marketdata.json", "utf8")).source)')
            PARTS="${PARTS:+$PARTS, }CH: $CH_SOURCE"
          fi
          if [ "${{ steps.compare_fr.outputs.new_data }}" = "true" ]; then
            FR_SOURCE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/fr/marketdata.json", "utf8")).source)')
            PARTS="${PARTS:+$PARTS, }FR: $FR_SOURCE"
          fi
          if [ "${{ steps.compare_be.outputs.new_data }}" = "true" ]; then
            BE_SOURCE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/be/marketdata.json", "utf8")).source)')
            PARTS="${PARTS:+$PARTS, }BE: $BE_SOURCE"
          fi
          if [ "${{ steps.compare_dk.outputs.new_data }}" = "true" ]; then
            DK_SOURCE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/dk/marketdata.json", "utf8")).source)')
            PARTS="${PARTS:+$PARTS, }DK: $DK_SOURCE"
          fi

          git commit -m "Update marketdata.json ($PARTS @ $TIMESTAMP)"
          git push

          echo "✅ Changes committed and pushed"
          echo "🚀 Deployment will be triggered automatically by push to main"

      - name: Summary (new data)
        if: >
          steps.compare.outputs.new_data == 'true' ||
          steps.compare_nl.outputs.new_data == 'true' ||
          steps.compare_at.outputs.new_data == 'true' ||
          steps.compare_ch.outputs.new_data == 'true' ||
          steps.compare_fr.outputs.new_data == 'true' ||
          steps.compare_be.outputs.new_data == 'true' ||
          steps.compare_dk.outputs.new_data == 'true'
        run: |
          echo "✅ Market data updated successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.compare.outputs.new_data }}" = "true" ]; then
            echo "🇩🇪 **DE Source:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/marketdata.json", "utf8")).source)')" >> $GITHUB_STEP_SUMMARY
            echo "📈 **DE Data points:** $(node -e 'console.log(JSON.parse(require("fs").readFileSync("public/data/marketdata.json", "utf8")).data.length)')" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.compare_nl.outputs.new_data }}" = "true" ]; then
