            echo "🧹 Cleaned up BE temporary file (no new data)"
          fi

      # ─── Denmark (DK) – Energy Charts only ────────────────────────

      - name: Rate-limit guard before DK
        run: sleep 5

      - name: Try fetching DK data from Energy Charts API
        id: energy_charts_dk
        continue-on-error: true
        run: |
          mkdir -p public/data/dk

          # Energy Charts: Renewable share forecast – non-fatal (429 or missing data → skip, price still usable)
          curl -fsSL $CURL_OPTS "https://api.energy-charts.info/ren_share_forecast?country=dk" -o public/data/dk/renewable_raw.json || true

          # Energy Charts: Day-ahead prices (15-min resolution) – required
          curl -fsSL $CURL_OPTS "https://api.energy-charts.info/price?country=dk" -o public/data/dk/price_raw.json || exit 1

          echo "success=true" >> $GITHUB_OUTPUT

      - name: Process Energy Charts DK data
        if: steps.energy_charts_dk.outputs.success == 'true'
        continue-on-error: true
        run: |
          node -e '
          const fs = require("fs");

          try {
            const renewableRaw = fs.existsSync("public/data/dk/renewable_raw.json") ? fs.readFileSync("public/data/dk/renewable_raw.json", "utf8") : null;
            const renewable = renewableRaw ? JSON.parse(renewableRaw) : {};
            const price = JSON.parse(fs.readFileSync("public/data/dk/price_raw.json", "utf8"));

            const priceMap = new Map();
            const renewableMap = new Map();
            const allTimestamps = new Set();

            if (price.unix_seconds && price.price) {
              price.unix_seconds.forEach((ts, i) => {
                const timestamp_ms = ts * 1000;
                priceMap.set(timestamp_ms, price.price[i]);
                allTimestamps.add(timestamp_ms);
              });
            }

            if (renewable.unix_seconds && renewable.ren_share) {
              renewable.unix_seconds.forEach((ts, i) => {
                const timestamp_ms = ts * 1000;
                renewableMap.set(timestamp_ms, renewable.ren_share[i]);
                allTimestamps.add(timestamp_ms);
              });
            }

            const merged = Array.from(allTimestamps).map(timestamp_ms => ({
              start_timestamp: timestamp_ms,
              end_timestamp: timestamp_ms + 15 * 60 * 1000,
              marketprice: priceMap.get(timestamp_ms) || null,
              renewable_share: renewableMap.get(timestamp_ms) || null,
              unit: "Eur/MWh",
              interpolated: false
            }));

            merged.sort((a, b) => a.start_timestamp - b.start_timestamp);

            console.log("Successfully processed Energy Charts DK data:");
            console.log("- Price points: " + priceMap.size);
            console.log("- Renewable points: " + renewableMap.size);
            console.log("- Total merged points: " + merged.length);

            fs.writeFileSync("public/data/dk/marketdata_new.json", JSON.stringify({
              object: "list",
              source: "energy-charts",
              data: merged
            }, null, 2));

          } catch (error) {
            console.error("Error processing Energy Charts DK data:", error);
            process.exit(1);
          }
          '
          rm -f public/data/dk/renewable_raw.json public/data/dk/price_raw.json

      - name: Validate DK market data
        if: steps.energy_charts_dk.outputs.success == 'true'
        continue-on-error: true
        run: |
          if ! node -e '
          const fs = require("fs");

          const file = "public/data/dk/marketdata_new.json";
          if (!fs.existsSync(file)) {
            console.error("❌ dk/marketdata_new.json not found");
            process.exit(1);
          }

          let parsed;
          try {
            parsed = JSON.parse(fs.readFileSync(file, "utf8"));
          } catch (e) {
            console.error("❌ Invalid JSON in dk/marketdata_new.json:", e.message);
            process.exit(1);
          }

          const errors = [];
          if (parsed.object !== "list") errors.push("Missing or wrong \"object\" field");
          if (!["energy-charts"].includes(parsed.source)) errors.push("Invalid source: " + parsed.source);
          if (!Array.isArray(parsed.data)) errors.push("\"data\" is not an array");

          if (errors.length > 0) {
            errors.forEach(e => console.error("❌ " + e));
            process.exit(1);
          }

          const data = parsed.data;
          if (data.length < 96) {
            console.error("❌ Too few data points: " + data.length + " (minimum 96)");
            process.exit(1);
          }

          const priceCount = data.filter(d => typeof d.marketprice === "number" && isFinite(d.marketprice)).length;
          if (priceCount === 0) {
            console.error("❌ All marketprice values are null/invalid – no usable price data");
            process.exit(1);
          }

          const now = Date.now();
          const validTs = data.map(d => d.start_timestamp).filter(ts => typeof ts === "number" && isFinite(ts) && ts > 0);
          const maxTs = Math.max(...validTs);
          const ageHours = (now - maxTs) / (1000 * 60 * 60);
          if (ageHours > 36) {
            console.error("❌ Newest data point is " + ageHours.toFixed(1) + "h old (max 36h)");
            process.exit(1);
          }

          console.log("✅ DK quality check passed:");
          console.log("   Data points : " + data.length);
          console.log("   Price points: " + priceCount);
          console.log("   Newest entry: " + new Date(maxTs).toISOString() + " (" + ageHours.toFixed(1) + "h ago)");
          console.log("   Source      : " + parsed.source);
          '; then
            echo "⚠️ DK validation failed – removing temporary file"
            rm -f public/data/dk/marketdata_new.json
          fi

      - name: Compare with previous DK data
        id: compare_dk
        run: |
          if [ ! -f "public/data/dk/marketdata_new.json" ]; then
