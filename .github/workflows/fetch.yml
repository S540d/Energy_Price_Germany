name: Fetch aWATTar market data
on:
  schedule:
    - cron: '0 * * * *'  # jede volle Stunde
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download new data
        run: |
          mkdir -p public
          curl -fsSL "https://api.awattar.de/v1/marketdata" -o public/marketdata_new.json

      - name: Compare with previous data
        id: compare
        run: |
          NEW_TS=$(jq '[.data[].start_timestamp] | max' public/marketdata_new.json)
          if [ -f public/marketdata.json ]; then
            OLD_TS=$(jq '[.data[].start_timestamp] | max' public/marketdata.json)
          else
            OLD_TS=""
          fi

          echo "OLD_TS=$OLD_TS"
          echo "NEW_TS=$NEW_TS"

          if [ "$OLD_TS" != "$NEW_TS" ]; then
            echo "new_data=true" >> $GITHUB_OUTPUT
          else
            echo "new_data=false" >> $GITHUB_OUTPUT
          fi

      - name: Archive, create quarter-hour data, and commit if changed
        if: steps.compare.outputs.new_data == 'true'
        run: |
          mkdir -p public/archive
          ts=$(date -u +"%Y-%m-%dT%H")
          cp public/marketdata_new.json "public/archive/marketdata_${ts}.json"
          mv public/marketdata_new.json marketdata.json

          # Viertelstunden-Daten erzeugen
          jq '{
            object: .object,
            data: [.data[] | . as $h | 
              {start_timestamp: $h.start_timestamp, end_timestamp: $h.start_timestamp+900000, marketprice: $h.marketprice, unit: $h.unit},
              {start_timestamp: $h.start_timestamp+900000, end_timestamp: $h.start_timestamp+1800000, marketprice: $h.marketprice, unit: $h.unit},
              {start_timestamp: $h.start_timestamp+1800000, end_timestamp: $h.start_timestamp+2700000, marketprice: $h.marketprice, unit: $h.unit},
              {start_timestamp: $h.start_timestamp+2700000, end_timestamp: $h.end_timestamp, marketprice: $h.marketprice, unit: $h.unit}
            ]
          }' public/marketdata.json > public/marketdata_quarter.json

          # Alte Archive (>30 Tage) löschen
          find public/archive/ -type f -name "marketdata_*.json" -mtime +30 -print -delete

          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add public/marketdata.json public/marketdata_quarter.json public/archive/
          git commit -m "Update marketdata.json & marketdata_quarter.json (new data from aWATTar @ ${ts} UTC)"
          git push

      - name: Skip commit if no change
        if: steps.compare.outputs.new_data == 'false'
        run: echo "No new data available – skipping commit."
