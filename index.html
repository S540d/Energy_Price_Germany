    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/Energy_Price_Germany/service-worker.js', { scope: '/Energy_Price_Germany/' })
            .then((registration) => {
              console.log('SW registered: ', registration);

              // Immediate update check on load
              registration.update();

              // Check for updates every 10 seconds
              setInterval(() => {
                registration.update();
              }, 10000);

              // Listen for update notifications and auto-apply
              navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'UPDATE_AVAILABLE') {
                  applyUpdate();
                }
              });

              // Handle update found and auto-apply
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('New service worker installing...');

                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New service worker installed, applying update automatically');
                    applyUpdate();
                  }
                });
              });
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }

      // Function to automatically apply updates
      function applyUpdate() {
        console.log('Applying update automatically...');

        // Tell service worker to skip waiting and activate new version
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
        }

        // Wait a moment for the service worker to activate, then reload
        setTimeout(() => {
          window.location.reload();
        }, 100);
      }
    </script>
