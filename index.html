    <script>
      // Hide initial loading screen once React starts rendering
      const initialLoading = document.getElementById('initial-loading');
      const observer = new MutationObserver(() => {
        if (document.getElementById('root')?.firstChild) {
          initialLoading.classList.add('fade-out');
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });

      // Fallback: hide loading after 5 seconds even if React doesn't render
      setTimeout(() => {
        if (initialLoading && !initialLoading.classList.contains('fade-out')) {
          initialLoading.classList.add('fade-out');
        }
      }, 5000);
    </script>
    <script>
      // Android visitors arrive here via search/links and would otherwise never learn
      // that a Play Store version exists. Shown once per browser, dismissible, and never
      // inside the installed PWA or the WebView-free native app.
      (function () {
        // Campaign attribution requires the UTM string inside a single URL-encoded
        // `referrer` parameter; bare utm_* query params are ignored by Google Play.
        // Mirrors playStoreUrlWithCampaign() in utils/appLinks.ts (no imports here).
        var PLAY_URL =
          'https://play.google.com/store/apps/details?id=com.sven4321.energypricegermany' +
          '&referrer=' +
          encodeURIComponent('utm_source=web_app&utm_medium=banner&utm_campaign=webapp');
        var STORAGE_KEY = 'playStoreBannerDismissed';

        function isDismissed() {
          try {
            return window.localStorage.getItem(STORAGE_KEY) === '1';
          } catch (e) {
            return false;
          }
        }

        function remember() {
          try {
            window.localStorage.setItem(STORAGE_KEY, '1');
          } catch (e) {
            /* private mode: banner may reappear next visit */
          }
        }

        var isAndroid = /Android/i.test(navigator.userAgent);
        var isStandalone =
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          window.navigator.standalone === true;

        if (!isAndroid || isStandalone || isDismissed()) return;

        var isGerman = (navigator.language || 'de').toLowerCase().indexOf('de') === 0;

        window.addEventListener('load', function () {
          var banner = document.createElement('div');
          banner.className = 'store-banner';

          var text = document.createElement('div');
          text.className = 'store-banner__text';
          text.textContent = isGerman
            ? 'Gibt es auch als Android-App bei Google Play.'
            : 'Also available as an Android app on Google Play.';

          var cta = document.createElement('a');
          cta.className = 'store-banner__cta';
          cta.href = PLAY_URL;
          cta.rel = 'noopener';
          cta.textContent = isGerman ? 'Installieren' : 'Install';

          var close = document.createElement('button');
          close.className = 'store-banner__close';
          close.type = 'button';
          close.setAttribute('aria-label', isGerman ? 'Hinweis schließen' : 'Dismiss');
          close.textContent = '×';
          close.addEventListener('click', function () {
            remember();
            banner.remove();
          });

          banner.appendChild(text);
          banner.appendChild(cta);
          banner.appendChild(close);
          document.body.appendChild(banner);
        });
      })();
    </script>
    <script>
      // Only register service worker in production (GitHub Pages)
      const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';

      if ('serviceWorker' in navigator && isProduction) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/Energy_Price_Germany/service-worker.js', { scope: '/Energy_Price_Germany/' })
            .then((registration) => {
              console.log('SW registered: ', registration);

              // Immediate update check on load
              registration.update();

              // Check for updates every 10 seconds
              setInterval(() => {
                registration.update();
              }, 10000);

              // Listen for update notifications and auto-apply
              navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'UPDATE_AVAILABLE') {
                  applyUpdate();
                }
              });

              // Handle update found and auto-apply
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('New service worker installing...');

                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New service worker installed, applying update automatically');
                    applyUpdate();
                  }
                });
              });
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      } else if ('serviceWorker' in navigator && !isProduction) {
        // On localhost, unregister any existing service workers to prevent caching issues
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => {
            console.log('Unregistering service worker on localhost:', registration);
            registration.unregister();
          });
        });
      }

      // Function to automatically apply updates
      function applyUpdate() {
        console.log('Applying update automatically...');

        // Tell service worker to skip waiting and activate new version
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
        }

        // Wait a moment for the service worker to activate, then reload
        setTimeout(() => {
          window.location.reload();
        }, 100);
      }
